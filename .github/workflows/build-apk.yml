name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode debug keystore for Firebase-signed APK
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare OfferVault.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk OfferVault.apk

      - name: Publish OfferVault.apk to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OfferVault APK (Latest Build)
          files: OfferVault.apk
          overwrite_files: true
          make_latest: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfferVault-debug-apk
          path: OfferVault.apk
          if-no-files-found: error
